
name: Build GEORUSH Self-Contained Windows App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop-requirements.txt
          pip install pyinstaller

      - name: Verify GEORUSH API imports
        run: |
          python -c "import main; print('GEORUSH API import OK:', main.app.title)"

      - name: Build single EXE
        run: |
          pyinstaller --clean --noconfirm GEORUSH-SEO.spec

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: cmd
        run: ISCC.exe GEORUSH-SEO-Installer.iss

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: GEORUSH-SEO-Windows-Installer-v19
          path: installer/GEORUSH-SEO-Setup.exe
